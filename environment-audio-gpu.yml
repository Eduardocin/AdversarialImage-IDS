name: adversarialimage-audio-gpu

channels:
  - conda-forge

dependencies:
  # Modern Python supported by recent PyTorch builds and audio/scientific libs.
  - python=3.11
  - pip>=24
  - setuptools
  - wheel

  # Scientific stack.
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - scikit-learn>=1.3
  - matplotlib>=3.8
  - pillow>=10
  - tqdm>=4.66
  - rich>=13
  - pyyaml>=6
  - psutil>=5.9

  # Audio utilities. The PoC mainly uses torchaudio, but these are useful for
  # debugging, diagnostics, and future waveform/spectrogram experiments.
  - librosa>=0.10
  - soundfile>=0.12
  - libsndfile
  - ffmpeg
  - sox

  # Notebook/debugging utilities.
  - ipykernel
  - jupyterlab

  # Common PyTorch runtime dependencies installed from conda-forge so pip only
  # needs to fetch the CUDA-enabled PyTorch wheels.
  - filelock
  - fsspec
  - jinja2
  - networkx
  - sympy
  - typing_extensions

  # Metrics and GPU monitoring.
  - torchmetrics>=1.4
  - nvidia-ml-py>=12

  - pip:
      # CUDA 12.6 PyTorch wheels are the safest modern option for this machine:
      # nvidia-smi reports driver CUDA 12.7, so cu126 is compatible while cu128
      # may require a newer driver.
      - --index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.0
      - torchvision==0.22.0
      - torchaudio==2.7.0

variables:
  # WSL exposes NVIDIA driver libraries here. This helps Python find libcuda.so.
  LD_LIBRARY_PATH: /usr/lib/wsl/lib
  PYTHONNOUSERSITE: "1"
